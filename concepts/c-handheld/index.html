<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#c4d69e">
<meta name="color-scheme" content="light dark">
<title>Fleet LCD</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/handheld.css">
</head>
<body>
<div id="screen" role="main" aria-label="Fleet board"></div>
<p id="live" class="sr" aria-live="polite"></p>
<form id="dev" hidden aria-label="Scenario switcher">
  <label for="dev-scenario">Scenario <select id="dev-scenario"></select></label>
  <p class="what" id="dev-what"></p>
  <label for="dev-tint">LCD <select id="dev-tint">
    <option value="">Auto (pea green by day, warm grey at night)</option>
    <option value="green">Pea green</option>
    <option value="grey">Warm grey</option>
  </select></label>
  <label for="dev-door"><input type="checkbox" id="dev-door"> Screen door</label>
  <label for="dev-still"><input type="checkbox" id="dev-still"> Still (no motion)</label>
  <button type="button" id="dev-close">Hide (D)</button>
</form>
<script src="fixture.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
