name: test
on: workflow_dispatch
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 to 3.14 is the supported range; 3.8 is not supported. 3.14 comes
        # from actions/setup-python's prebuilt python-versions releases, which
        # ship it for ubuntu-latest, macos-latest and windows-latest. This matrix
        # is unverified: the workflow is manual (workflow_dispatch only) and
        # has not been run.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
