name: test
on: workflow_dispatch
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 to 3.14 is the supported range; 3.8 is not supported. 3.14 comes
        # from actions/setup-python's prebuilt python-versions releases, which
        # ship it for ubuntu-latest, macos-latest and windows-latest. The workflow
        # is run by hand (workflow_dispatch only). It was first run on 2026-10-16:
        # the first run failed 13 tests on the Windows legs, which were fixed the
        # same day, and the second run passed all 18 jobs. A green run is a record
        # of that day, not a promise.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
